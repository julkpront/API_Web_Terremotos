<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <link rel="stylesheet" href="style.css">
     <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>


    <title>Consultora de terremotos</title>
</head>
<body class="intro-activa">
    <!-- INTRO: vídeo de bienvenida a pantalla completa. Se controla desde intro.js -->
    <div id="intro" class="intro">
        <!-- muted + playsinline son necesarios para que el navegador permita el autoplay -->
        <video id="introVideo" src="intro.mp4" muted playsinline autoplay preload="auto"></video>
        <button type="button" id="saltarIntro" class="saltar-intro">Saltar intro ▶</button>
    </div>

    <header>
        <h1>🌋 Terremotos en el mundo</h1>

        <!-- Barra de usuario (login simulado): se controla desde Scriptleaflet.js y favoritos.js -->
        <div class="barra-usuario">
            <!-- Se ve cuando NO hay sesión -->
            <form id="formLogin" class="form-login">
                <label for="nombreUsuario">Usuario</label>
                <input type="text" id="nombreUsuario" maxlength="20" placeholder="Tu nombre" autocomplete="username" required>
                <button type="submit">Entrar</button>
            </form>

            <!-- Se ve cuando SÍ hay sesión (el atributo hidden lo oculta) -->
            <div id="sesionActiva" class="sesion-activa" hidden>
                <span>👤 <strong id="usuarioNombre"></strong></span>
                <button type="button" id="botonSalir">Salir</button>
            </div>
        </div>
        <p id="mensajeUsuario" class="mensaje" role="status"></p>

        <!-- Leyenda de colores: se rellena desde Scriptleaflet.js -->
        <p>Color de cada punto según su magnitud:</p>
        <div id="leyenda"></div>
    </header>

    <main>
        <!-- MAPA 1: terremotos del último día-->
        <section>
            <h2>Mapa 1: terremotos de las últimas 24 horas</h2>

            <!-- Botones-filtro: qué terremotos se pintan en el mapa 1 -->
            <div class="vistas" role="group" aria-label="Qué terremotos mostrar en el mapa 1">
                <button type="button" id="botonVistaApi" class="boton-vista activo" aria-pressed="true">Terremotos de la API</button>
                <button type="button" id="botonVistaFavoritos" class="boton-vista" aria-pressed="false" disabled>⭐ Mis favoritos</button>
            </div>

            <p id="mensaje1" class="mensaje" role="status"></p>

            <!-- El contenedor sirve para poner la animación de carga ENCIMA del mapa -->
            <div class="contenedor-mapa">
                <div id="map" class="mapa"></div>
                <div id="cargando1" class="cargando">
                    <div class="spinner"></div>
                    <p>Cargando terremotos...</p>
                </div>
            </div>
        </section>

        <!--  MAPA 2: terremotos con filtros  -->
        <section>
            <h2>Mapa 2: filtrar por magnitud y fechas</h2>

            <form id="filtros">
                <div class="campo">
                    <label for="magnitud">Magnitud mínima</label>
                    <input type="number" id="magnitud" min="0" max="10" step="0.1" value="6">
                </div>

                <div class="campo">
                    <label for="fechaInicio">Fecha de inicio</label>
                    <input type="date" id="fechaInicio">
                </div>

                <div class="campo">
                    <label for="fechaFin">Fecha de fin</label>
                    <input type="date" id="fechaFin">
                </div>

                <button type="submit" id="botonFiltrar">Filtrar</button>
            </form>

            <p id="mensaje2" class="mensaje" role="status"></p>

            <div class="contenedor-mapa">
                <div id="map2" class="mapa"></div>
                <div id="cargando2" class="cargando">
                    <div class="spinner"></div>
                    <p>Cargando terremotos...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="intro.js" defer></script>
    <!-- favoritos.js va ANTES de Scriptleaflet.js porque este usa sus funciones -->
    <script src="favoritos.js" defer></script>
    <script src="Scriptleaflet.js" defer></script>
</body>
</html>
